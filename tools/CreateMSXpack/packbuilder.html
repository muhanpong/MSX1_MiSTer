<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSX Pack Forge</title>
<style>
:root{
  --ground:#f4f6fa; --panel:#ffffff; --panel-2:#eef1f7; --line:#d7dce7; --line-soft:#e6eaf2;
  --ink:#1b2033; --ink-2:#5a6480; --ink-3:#8b93a9;
  --accent:#0f7c96; --accent-ink:#ffffff; --accent-soft:#dff1f6;
  --ok:#15794f; --ok-soft:#dff0e6; --warn:#8a5a10; --warn-soft:#faeed6; --bad:#a4302f; --bad-soft:#f8e2e1;
  --shadow:0 1px 2px rgba(23,30,50,.06), 0 8px 24px rgba(23,30,50,.05);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","D2Coding",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#12151f; --panel:#1a1f2c; --panel-2:#222838; --line:#2f3648; --line-soft:#272d3d;
  --ink:#e8ecf5; --ink-2:#a6b0c6; --ink-3:#737d94;
  --accent:#54c6dd; --accent-ink:#0b1017; --accent-soft:#16333c;
  --ok:#5fd39b; --ok-soft:#14301f; --warn:#e3b264; --warn-soft:#302512; --bad:#f08c86; --bad-soft:#331a19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#12151f; --panel:#1a1f2c; --panel-2:#222838; --line:#2f3648; --line-soft:#272d3d;
  --ink:#e8ecf5; --ink-2:#a6b0c6; --ink-3:#737d94;
  --accent:#54c6dd; --accent-ink:#0b1017; --accent-soft:#16333c;
  --ok:#5fd39b; --ok-soft:#14301f; --warn:#e3b264; --warn-soft:#302512; --bad:#f08c86; --bad-soft:#331a19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;padding-block:20px 56px}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px;margin:2px 0 0}
header.top{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:18px}
header.top .spacer{flex:1}
.theme-btn{font:inherit;font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:5px 10px;cursor:pointer}
.theme-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.top-tools{display:flex;gap:8px;align-items:center}
.seg.lang button{padding:5px 10px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:860px){ .grid{grid-template-columns:1fr} }
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel .hd{padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.panel .hd h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0}
.panel .bd{padding:14px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){ .rail{position:static} }
.drop{border:1.5px dashed var(--line);border-radius:9px;background:var(--panel-2);padding:18px 14px;text-align:center;
  transition:border-color .15s,background .15s}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.btn{font:inherit;font-weight:500;border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:14px;font-size:13px}
.meter dt{color:var(--ink-2)}
.meter dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.missing{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px}
.missing h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.missing ul{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto}
.missing li{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:3px 0;border-bottom:1px solid var(--line-soft);
  word-break:break-all}
.missing li:last-child{border-bottom:0}
.missing li{cursor:pointer;display:flex;gap:8px;align-items:baseline}
.missing li:hover{color:var(--ink)}
.missing li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.missing li .c{color:var(--ink-3);font-size:10.5px;white-space:nowrap}
.missing li.hit{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding-left:5px;padding-right:5px}
.row{cursor:pointer}
.row.hit{box-shadow:inset 0 0 0 2px var(--accent)}
.det{grid-column:1/-1;margin-top:9px;border-top:1px solid var(--line-soft);padding-top:8px;
  display:flex;flex-direction:column;gap:2px}
.det .r{display:grid;grid-template-columns:9px 1fr auto auto;gap:8px;align-items:center;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:3px 5px;border-radius:5px}
.det .r .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.det .r.no{color:var(--bad);cursor:pointer} .det .r.no .dot{background:var(--bad)}
.det .r.optno{color:var(--warn);cursor:pointer} .det .r.optno .dot{background:var(--warn)}
.det .r.hit{background:var(--accent-soft)}
.det .f{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det .where{font-style:normal;color:var(--ink-3)}
.det .sha{color:var(--ink-3);font-size:10.5px;white-space:nowrap}
.det .r.forced{color:var(--warn)} .det .r.forced .dot{background:var(--warn)}
.det .pin{font:inherit;font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.det .pin:hover{border-color:var(--ink-3);color:var(--ink)}
.det .alt{color:var(--accent);font-size:10.5px}
.det .tip{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-top:5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{font:inherit;flex:1;min-width:150px;padding:7px 11px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink)}
.toolbar input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:12px;padding:6px 11px;background:transparent;border:0;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.vendor{margin-top:18px}
.vendor:first-of-type{margin-top:0}
.vendor > h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600;
  display:flex;align-items:baseline;gap:8px}
.vendor > h3 span{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.row.ready{border-left:3px solid var(--ok)}
.row.partial{border-left:3px solid var(--warn)}
.row.blocked{border-left:3px solid var(--line);opacity:.72}
@media (max-width:560px){ .row{grid-template-columns:1fr auto} .row .pill{grid-column:1/-1;justify-self:start} }
.row .nm{min-width:0}
.row .nm b{font-weight:600;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--ink-3);font-family:var(--mono);font-size:11px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:34px 14px;text-align:center;color:var(--ink-3);font-size:13px}
.log{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);max-height:130px;overflow-y:auto}
.log div{padding:2px 0}
.log .err{color:var(--bad)}
.note{font-size:12px;color:var(--ink-3);margin:12px 0 0;line-height:1.55}
.note code{font-family:var(--mono);font-size:11px;background:var(--panel-2);padding:1px 4px;border-radius:3px}
.toast{margin-bottom:10px;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line)}
.toast.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.toast.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.saveinfo{font-size:12px;color:var(--ink-3);margin-left:auto}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* ---- first run: nothing read yet ---- */
.intro{display:none;flex-wrap:wrap;gap:20px;margin-bottom:22px}
.first .intro{display:flex}
.intro .hero{flex:3 1 420px;min-width:0;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);
  padding:40px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center}
.intro .hero.hot{border-style:solid}
.intro .hero h2{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.intro .hero p{margin:0;color:var(--ink-2);font-size:14px;max-width:520px}
.intro .hero .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.intro .hero .btn{font-size:14px;padding:11px 20px;border-radius:10px}
.intro .hero details{font-size:12.5px;color:var(--ink-2);max-width:520px}
.intro .hero summary{cursor:pointer;color:var(--accent)}
.intro .hero details .note{margin-top:6px;text-align:left;color:var(--ink-2)}
.steps{flex:2 1 280px;min-width:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;justify-content:center}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--panel-2);color:var(--ink);font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.steps li:first-child .n{background:var(--accent);color:var(--accent-ink)}
.steps b{display:block}
.steps span.d{color:var(--ink-2);font-size:13px}
.suphd,.firstfoot{display:none}
.first .suphd{display:block;margin-bottom:10px}
.first .firstfoot{display:block}
.suphd h2{font-size:15px;font-weight:650;margin:0}
.suphd h2 span{font-weight:400;color:var(--ink-2);margin-left:6px}
.suphd p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.first .grid{grid-template-columns:1fr}
.first .rail,.first #buildAll,.first #buildSram,.first #toolbarSeg,.first .saveinfo,.first .row .btn,.first .det .pin{display:none}
.first #list .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:700px){ .first #list .rows{grid-template-columns:1fr} }
.first .row{grid-template-columns:1fr auto}
.first .row.blocked{opacity:1}
.first .pill.bad{background:var(--panel-2);color:var(--ink-2);font-weight:500}

</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>MSX Pack Forge</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="spacer"></div>
    <div class="top-tools">
      <div class="seg lang" id="lang" role="group" aria-label="Language / 언어 / 言語">
        <button data-lang="ko" lang="ko" aria-pressed="false">한국어</button><button data-lang="en" lang="en" aria-pressed="false">English</button><button data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
      </div>
      <button class="theme-btn" id="theme" data-i18n="theme"></button>
    </div>
  </header>

  <section class="intro" aria-labelledby="heroHd">
    <div class="hero" id="hero">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      <h2 id="heroHd" data-i18n="heroHd"></h2>
      <p data-i18n="heroSub"></p>
      <div class="btns">
        <button class="btn btn-primary" id="heroFiles" data-i18n="pickFiles"></button>
        <button class="btn btn-ghost" id="heroDir" data-i18n="pickDir"></button>
      </div>
      <details><summary data-i18n="howHd"></summary><p class="note" data-i18n="romNote"></p></details>
    </div>
    <ol class="steps">
      <li><span class="n">1</span><span><b data-i18n="s1t"></b><span class="d" data-i18n="s1d"></span></span></li>
      <li><span class="n">2</span><span><b data-i18n="s2t"></b><span class="d" data-i18n="s2d"></span></span></li>
      <li><span class="n">3</span><span><b data-i18n="s3t"></b><span class="d" data-i18n="s3d"></span></span></li>
    </ol>
  </section>

  <div class="grid">
    <aside class="rail">
      <div class="panel">
        <div class="hd"><h2 data-i18n="store"></h2></div>
        <div class="bd">
          <div class="drop" id="drop">
            <p data-i18n="dropHint"></p>
            <button class="btn btn-primary btn-sm" id="pickFiles" data-i18n="pickFiles"></button>
            <button class="btn btn-ghost btn-sm" id="pickDir" data-i18n="pickDir"></button>
          </div>
          <div class="bar"><i id="bar"></i></div>
          <dl class="meter">
            <dt data-i18n="mFiles"></dt><dd id="mFiles">0</dd>
            <dt data-i18n="mHashes"></dt><dd id="mHashes">0</dd>
            <dt data-i18n="mNeeded"></dt><dd id="mNeeded">0</dd>
            <dt data-i18n="mReady"></dt><dd id="mReady">0</dd>
          </dl>
          <div class="missing" id="synthWrap" hidden>
            <h3 data-i18n="synthHd"></h3>
            <ul id="synthList"></ul>
          </div>
          <div class="missing" id="missingWrap" hidden>
            <h3><span data-i18n="missHd"></span> <span id="missCount" style="font-weight:400;color:var(--ink-3)"></span></h3>
            <ul id="missingList"></ul>
          </div>
          <div class="log" id="log"></div>
        </div>
      </div>
      <p class="note" style="border-left:3px solid currentColor;padding-left:8px" data-i18n="sramNote"></p>
      <p class="note" data-i18n="romNote"></p>
    </aside>

    <main>
      <div id="toast" class="toast" hidden></div>
      <div class="suphd"><h2><span data-i18n="supHd" style="margin:0;color:inherit;font-weight:650"></span><span id="supCount"></span></h2><p data-i18n="supSub"></p></div>
      <div class="toolbar">
        <input type="search" id="q" data-i18n-ph="qPh" data-i18n-aria="qAria">
        <div class="seg" id="toolbarSeg" role="group" data-i18n-aria="segAria">
          <button id="fAll" aria-pressed="true" data-i18n="fAll"></button>
          <button id="fReady" aria-pressed="false" data-i18n="fReady"></button>
        </div>
        <button class="btn btn-primary btn-sm" id="buildAll" disabled></button>
        <button class="btn btn-ghost btn-sm" id="buildSram" data-i18n="buildSram" data-i18n-title="buildSramTitle"></button>
      </div>
      <div id="list"></div>
      <p class="note firstfoot" data-i18n="firstFoot"></p>
    </main>
  </div>
</div>

  bytes(){const o=new Uint8Array(this.len);let p=0;for(const x of this.parts){o.set(x,p);p+=x.length;}return o;}

  const h=head16(), cfg=BLOCK_TYPES[v.t];

  h[8]=MAPPER_TYPES.indexOf(cfg.MAPPER);
  if(v.start!==undefined&&v.start!==null){
    let mode=0,param=0,block=v.start,off=0;
    for(let i=0;i<(n>4?4:n);i++){
      if(v.t==="ROM_MIRROR"||v.t==="MIRROR"){mode|=1<<(2*block);param|=((v.ref.start+i)&3)<<(2*block);}
      else if(v.t==="IO_MIRROR"){mode|=3<<(2*block);}
      else if(cfg.MAPPER!=="MAPPER_UNUSED"){mode|=2<<(2*block);param|=off<<(2*block);}
      else if(cfg.DEVICE!=="NONE"){mode|=3<<(2*block);}
      block=(block+1)&3; off=(off+1)&3;
    }
    h[9]=mode&255;h[10]=param&255;h[11]=(v.p===undefined?3:v.p)&255;h[12]=cfg.SRAM;
  }
  return h;
}
const mkConfig=c=>{const h=head16();h[3]=CONFIG_TYPES.indexOf("CONFIG")<<4;h[4]=c&255;return h;};
const mkDevice=(t,s)=>{const h=head16();h[3]=CONFIG_TYPES.indexOf("DEVICE")<<4;h[4]=0;h[5]=(s>>8)&255;h[6]=s&255;
  h[7]=DEVICE_TYPES.indexOf(t)-1;return h;};
const mkFwBlock=(t,s)=>{const h=head16();h[3]=0;h[4]=t;h[5]=(s>>8)&255;h[6]=s&255;return h;};
function b64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

async function buildMSX(m,getRom){
  const out=new Out(); let config=0; const deferred=[];
  for(const s of m.slots){
    for(const b of s.b){
      const v={...b};
      if(v.r!==undefined) v.ref=s.b.find(x=>x.start===(parseInt(v.r,10)&3));
      const h=mkBlock(s.ps,s.ss,v);
      if(v.r===undefined){
        out.push(h);
        if(hashesOf(v).length){
          const got=await firstRom(v,getRom);
          if(!got) throw new Error(t("romMissing",v.f||"",hashesOf(v).join(" / ")));
          const rom=got.rom;
          const want=(v.n|0)*16*1024, from=v.s||0;
          const slice=rom.subarray(Math.min(from,rom.length),Math.min(from+want,rom.length));
          out.push(slice); out.fill(0xFF,want-slice.length);
        }
      } else deferred.push(h);
    }
    if(s.ss>0) config|=1<<s.ps;
  }
  for(const h of deferred) out.push(h);
  for(const d of (m.devices||[])){
    // 장치 ROM이 없으면 크기 0으로 헤더만 씁니다 (원본 파이썬과 같은 동작).
    let size=0,rom=null;
    const got=await firstRom(d,getRom);
    if(got){ rom=got.rom; size=rom.length>>14; }
    out.push(mkDevice(d.typ,size));
    if(size>0) out.push(rom);
  }
  if(m.kbd!==undefined){ out.push(mkBlock(0,0,{t:"KBD LAYOUT",n:0})); out.push(b64(DATA.layouts[m.kbd])); }
  config|=(MSX_TYPES.indexOf(m.type)&3)<<4;
  out.push(mkConfig(config));
  return out.bytes();
}
//  한 자리에 SHA-1 을 여러 개 적을 수 있습니다.  같은 펌웨어의 다른 덤프가 모두 쓸
//  만할 때를 위한 것이고, XML 에 적힌 순서대로 먼저 있는 것이 뽑히므로 보관소가 같으면
//  결과도 같습니다.
const hashesOf=o=>(o.hs||(o.h?[o.h]:[])).map(x=>String(x).toLowerCase());
async function firstRom(o,getRom){
  for(const h of hashesOf(o)){ const r=await getRom(h); if(r) return {h,rom:r}; }
  return null;
}

async function buildFW(m,getRom){
  const out=new Out();
  for(const fw of m.fw){
    const typ=EXTENSIONS.indexOf(fw.name);
    if(typ<0||!hashesOf(fw).length) continue;
    const got=await firstRom(fw,getRom);
    if(!got) throw new Error(t("romMissing",fw.f||"",hashesOf(fw).join(" / ")));
    const rom=got.rom;
    const fileSize=rom.length, size=(fw.sz!==undefined)?fw.sz:fileSize;
    out.push(mkFwBlock(typ,size>>14));
    const from=fw.s||0;
    out.push(fw.sz!==undefined ? rom.subarray(Math.min(from,rom.length),Math.min(from+size,rom.length))
                               : rom.subarray(Math.min(from,rom.length)));
    if(size>fileSize) out.fill(0xFF,size-fileSize);
  }
  return out.bytes();
}
//  자리마다 대표 해시(목록의 첫 번째) 하나씩.  "있는지" 판정은 romNeeds/pickHash 가 합니다.
const requiredHashes=m=>{const s=new Set();
  if(m.kind==="fw"){for(const f of m.fw){const h=hashesOf(f)[0]; if(h) s.add(h);}}
  else for(const sl of m.slots) for(const b of sl.b){const h=hashesOf(b)[0]; if(h) s.add(h);}
  return [...s];};
const optionalHashes=m=>{const s=new Set();
  if(m.kind!=="fw") for(const d of (m.devices||[])){const h=hashesOf(d)[0]; if(h) s.add(h);}
  return [...s];};

/* ---------- SHA-1: SubtleCrypto, 없으면 순수 JS ---------- */
function sha1js(bytes){
  const ml=bytes.length, withOne=ml+1, blocks=Math.ceil((withOne+8)/64), total=blocks*64;
  const b=new Uint8Array(total); b.set(bytes); b[ml]=0x80;
  const dv=new DataView(b.buffer); dv.setUint32(total-4, (ml<<3)>>>0); dv.setUint32(total-8, Math.floor(ml/536870912));
  let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0; const w=new Int32Array(80);
  for(let i=0;i<total;i+=64){
    for(let j=0;j<16;j++) w[j]=dv.getInt32(i+j*4);
    for(let j=16;j<80;j++){const n=w[j-3]^w[j-8]^w[j-14]^w[j-16]; w[j]=(n<<1)|(n>>>31);}
    let a=h0,bb=h1,c=h2,d=h3,e=h4;
    for(let j=0;j<80;j++){
      let f,k;
      if(j<20){f=(bb&c)|(~bb&d);k=0x5A827999;}
      else if(j<40){f=bb^c^d;k=0x6ED9EBA1;}
      else if(j<60){f=(bb&c)|(bb&d)|(c&d);k=0x8F1BBCDC;}
      else {f=bb^c^d;k=0xCA62C1D6;}
      const t=(((a<<5)|(a>>>27))+f+e+k+w[j])|0;
      e=d;d=c;c=(bb<<30)|(bb>>>2);bb=a;a=t;
    }
    h0=(h0+a)|0;h1=(h1+bb)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;
  }
  return [h0,h1,h2,h3,h4].map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
async function sha1(buf){
  if(self.crypto&&self.crypto.subtle){
    try{ const d=await crypto.subtle.digest("SHA-1",buf);
      return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){}
  }
  return sha1js(new Uint8Array(buf));
}

/* ---------- store-only ZIP (라이브러리 없이) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), locals=[], central=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true); lh.set(name,30);
    locals.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,off,true); ch.set(name,46);
    central.push(ch); off+=lh.length+data.length;
  }
  let csize=0; for(const c of central) csize+=c.length;
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,central.length,true); ev.setUint16(10,central.length,true);
  ev.setUint32(12,csize,true); ev.setUint32(16,off,true);
  const all=[...locals,...central,end]; let total=0; for(const p of all) total+=p.length;
  const o=new Uint8Array(total); let p=0; for(const x of all){o.set(x,p);p+=x.length;}
  return o;
}

/* ---------- ZIP / GZIP 풀기 (라이브러리 없이) ----------
   콜렉션이 .zip 으로 도는 일이 많아서, 압축을 미리 풀지 않아도 되게 합니다.
   브라우저 내장 DecompressionStream 만 씁니다: store(0) 와 deflate(8), 그리고 .gz.   */
const canInflate = typeof DecompressionStream === "function";
async function unstream(bytes, fmt){
  const ds = new DecompressionStream(fmt);
  const ab = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}
const zu32=(dv,o)=>dv.getUint32(o,true), zu16=(dv,o)=>dv.getUint16(o,true);

//  중앙 디렉터리를 읽어 항목 목록을 돌려줍니다.  크기는 항상 중앙 디렉터리에서 읽으므로
//  데이터 서술자(flag bit 3)를 쓰는 아카이브도 그대로 처리됩니다.
async function readZip(bytes, onSkip){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eo = -1;
  for(let i=bytes.length-22; i>=Math.max(0,bytes.length-22-65535); i--)
    if(zu32(dv,i)===0x06054b50){ eo=i; break; }
  if(eo<0) throw new Error(t("zipNoEnd"));
  let count = zu16(dv,eo+10), cdOff = zu32(dv,eo+16);
  if(count===0xFFFF || cdOff===0xFFFFFFFF){            // ZIP64
    const lo = eo-20;
    if(lo>=0 && zu32(dv,lo)===0x07064b50){
      const z = Number(dv.getBigUint64(lo+8,true));
      if(z+56<=bytes.length && zu32(dv,z)===0x06064b50){
        count = Number(dv.getBigUint64(z+32,true));
        cdOff = Number(dv.getBigUint64(z+48,true));
      }
    }
  }
  const dec = new TextDecoder("utf-8"), out = [];
  let p = cdOff;
  for(let n=0; n<count && p+46<=bytes.length; n++){
    if(zu32(dv,p)!==0x02014b50) break;
    const flag=zu16(dv,p+8), method=zu16(dv,p+10);
    const nlen=zu16(dv,p+28), elen=zu16(dv,p+30), clen=zu16(dv,p+32);
    let csize=zu32(dv,p+20), lho=zu32(dv,p+42);
    const name = dec.decode(bytes.subarray(p+46, p+46+nlen));
    if(csize===0xFFFFFFFF || lho===0xFFFFFFFF){        // ZIP64 확장 필드
      let q=p+46+nlen; const end=q+elen;
      while(q+4<=end){
        const id=zu16(dv,q), sz=zu16(dv,q+2); let r=q+4;
        if(id===0x0001){
          if(zu32(dv,p+24)===0xFFFFFFFF) r+=8;                          // uncompressed
          if(csize===0xFFFFFFFF){ csize=Number(dv.getBigUint64(r,true)); r+=8; }
          if(lho===0xFFFFFFFF){ lho=Number(dv.getBigUint64(r,true)); r+=8; }
        }
        q += 4+sz;
      }
    }
    p += 46+nlen+elen+clen;
    if(name.endsWith("/")) continue;                                    // 디렉터리
    if(flag & 0x0001){ onSkip(name,t("encrypted")); continue; }
    if(method!==0 && method!==8){ onSkip(name,t("badMethod",method)); continue; }
    if(method===8 && !canInflate){ onSkip(name,t("noDeflate")); continue; }
    if(lho+30>bytes.length || zu32(dv,lho)!==0x04034b50){ onSkip(name,t("badLocal")); continue; }
    const ds = lho+30+zu16(dv,lho+26)+zu16(dv,lho+28);                  // 지역 헤더의 확장 필드가 다를 수 있음
    out.push({name, method, data: bytes.subarray(ds, ds+csize)});
  }
  return out;
}

const looksZip = b => b.length>=4 && b[0]===0x50 && b[1]===0x4B && b[2]===0x03 && b[3]===0x04;
const looksGz  = b => b.length>=2 && b[0]===0x1F && b[1]===0x8B;

//  아카이브면 풀어서, 아니면 그대로 sink 로 넘깁니다.  중첩은 두 겹까지만 따라갑니다.
async function expandArchive(name, bytes, depth, sink, onSkip){
  if(depth>2){ await sink(name,bytes); return; }
  if(looksGz(bytes)){
    if(!canInflate){ onSkip(name,t("noGzip")); return; }
    try{ await expandArchive(name.replace(/\.gz$/i,""), await unstream(bytes,"gzip"), depth+1, sink, onSkip); }
    catch(e){ onSkip(name,t("gzFail")); }
    return;
  }
  if(!looksZip(bytes)){ await sink(name,bytes); return; }
  let members;
  try{ members = await readZip(bytes,onSkip); }
  catch(e){ onSkip(name,t("zipRead")); return; }
  for(const m of members){
    let data;
    try{ data = m.method===8 ? await unstream(m.data,"deflate-raw") : m.data; }
    catch(e){ onSkip(m.name,t("inflateFail")); continue; }
    await expandArchive(m.name, data, depth+1, sink, onSkip);
  }
}

/* ---------- turbo R 디스크 ROM 합성 ----------
   FS-A1ST / FS-A1GT 는 디스크 드라이버와 MSX-DOS 2 커널을 펌웨어 0x60000 의 64 kB
   한 덩어리에 담고 있습니다.  그 드라이버는 TC8566AF 용이고 이 코어에는 WD2793 밖에
   없어서, Sony HB-F1XD 의 WD2793 드라이버로 갈아 끼우고 커널을 다시 연결합니다.
   tools/turbor_diskrom/synth_diskrom.py 와 같은 34개 패치이며, 여기에는 주소와 우리가
   써 넣는 점프/콜 바이트만 있습니다.  ROM 내용은 들어 있지 않고, 재료는 사용자가 올린
   본인 덤프입니다.  결과는 알려진 SHA-1 로 검사하고, 어긋나면 버립니다.        */
const TR_HB='12f2cc79b3d09723840bae774be48c0d721ec1c6';
const TR_HBSYM={DSKIO:0x751E,DSKCHG:0x78BA,GETDPB:0x7943,CHOICE:0x795D,DSKFMT:0x79A0,MTOFF:0x7DE2,
                INIHRD:0x7827,DRIVES:0x7867,DEFDPB:0x74E7,INIENV:0x78A7,OEMSTA:0x7DE0};
const TR_OFF=0x60000, TR_LEN=0x10000, TR_LO=0x7405, TR_HI=0x7FD0;
const TR_STUB=[0x32,0xF0,0x7F,0xC9,0xC3,0xB7,0x78];         // 7FD0: LD (7FF0),A / RET   7FD4: JP 78B7
const TR_MODELS={
  st:{label:"FS-A1ST", fw:'c212b11fda13f83dafed688c54d098e7e47ab225',
      disk:'84a44ecf6f2dcfc1102f43ec7f6ddf687a44aadf',
      out:'fs-a1st_diskrom_wd2793.rom', outSha:'94f4587db749af02f82837b3dbad7fc6e55f15e9',
      jt:{DSKIO:0x7495,DSKCHG:0x77CA,GETDPB:0x7820,CHOICE:0x783B,DSKFMT:0x7C6D,MTOFF:0x7746},
      k:{INIHRD:[0x47D6,0x7724],DRIVES:[0x48C6,0x777A],DEFDPB:[0x48F8,0x7416],
         INIENV:[0x4904,0x77A1],OEMSTA:[0x5796,0x7878]},
      mysize:[0x489A,0x1A], handler:0x77B6,
      kmap:{GETWRK:0x4DCD,SETINT:0x4DFE,PROMPT:0x4D4F,DIV:0x4E67,TIMER:0x4E14}},
  gt:{label:"FS-A1GT", fw:'e779c338eb91a7dea3ff75f3fde76b8af22c4a3a',
      disk:'0527fb75775caa76c7eca8d449938ace83d36e96',
      out:'fs-a1gt_diskrom_wd2793.rom', outSha:'86f81c71c858d98e2d4031566efd3b5a3843e279',
      jt:{DSKIO:0x7459,DSKCHG:0x779D,GETDPB:0x77F9,CHOICE:0x781A,DSKFMT:0x7C52,MTOFF:0x7713},
      k:{INIHRD:[0x47D6,0x76F1],DRIVES:[0x48C6,0x7747],DEFDPB:[0x48F8,0x73DA],
         INIENV:[0x4904,0x7771],OEMSTA:[0x5796,0x785D]},
      mysize:[0x489A,0x1F], handler:0x7789,
      kmap:{GETWRK:0x4DD8,SETINT:0x4E09,PROMPT:0x4D5A,DIV:0x4E72,TIMER:0x4E1F}}};

const trW=v=>[v&0xFF,(v>>8)&0xFF];
const trHex=a=>[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
const trSame=(a,b)=>a.length===b.length&&[...a].every((x,i)=>x===b[i]);

//  disk = 64 kB 디스크 ROM, hb = 16 kB HB-F1XD 디스크 ROM.  원본 바이트가 예상과
//  다르면 바로 던집니다 (파이썬 쪽 assert 와 같은 자리).
function trSynth(disk, hb, m){
  if(disk.length!==TR_LEN) throw new Error(t("diskLen",disk.length));
  if(hb.length!==0x4000)   throw new Error(t("hbLen",hb.length));
  const banks=[0,1,2,3].map(i=>disk.slice(i*0x4000,(i+1)*0x4000));
  const put=(bk,a,nw,old,why)=>{
    const o=a-0x4000, got=banks[bk].subarray(o,o+nw.length);
    if(!trSame(got,old)) throw new Error(`bank${bk} ${a.toString(16).toUpperCase()}: ${trHex(got)} ≠ ${trHex(old)} (${why})`);
    banks[bk].set(nw,o);
  };
  const drv=hb.slice(TR_LO-0x4000,TR_HI-0x4000);
  const dp=(a,nw,old,why)=>{
    const o=a-TR_LO, got=drv.subarray(o,o+nw.length);
    if(!trSame(got,old)) throw new Error(`hb ${a.toString(16).toUpperCase()}: ${trHex(got)} ≠ ${trHex(old)} (${why})`);
    drv.set(nw,o);
  };
  const km=m.kmap;
  //  DOS1 드라이버가 부르던 DOS1 커널 서비스를 DOS2 커널의 같은 서비스로 돌립니다.
  for(const a of [0x7694,0x7869,0x78A7,0x78BD,0x7B62,0x7B95])
    dp(a,[0xCD,...trW(km.GETWRK)],[0xCD,...trW(0x5FC2)],'GETWRK');
  dp(0x78B4,[0xC3,...trW(km.SETINT)],[0xC3,...trW(0x5FF6)],'SETINT');
  dp(0x776C,[0xCD,...trW(km.PROMPT)],[0xCD,...trW(0x625A)],'PROMPT');
  dp(0x76CD,[0xCD,...trW(km.DIV)],  [0xCD,...trW(0x492F)],'DIV');
  dp(0x78B1,[0x21,...trW(0x7FD4)],  [0x21,...trW(0x78B7)],'INIENV handler -> trampoline 7FD4');
  dp(0x78B7,[0xC3,...trW(km.TIMER)],[0xC3,...trW(0x6027)],'timer handler -> DOS2 common');

  const NAMES=['DSKIO','DSKCHG','GETDPB','CHOICE','DSKFMT','MTOFF'];
  for(const bk of [0,1]){
    banks[bk].set(drv,TR_LO-0x4000);
    NAMES.forEach((nm,i)=>put(bk,0x4010+3*i,[0xC3,...trW(TR_HBSYM[nm])],[0xC3,...trW(m.jt[nm])],'jump table '+nm));
  }
  for(const nm of Object.keys(m.k)){
    const [site,old]=m.k[nm];
    const op = nm==='DEFDPB'?0x21 : (nm==='OEMSTA'?0xC3:0xCD);
    put(0,site,[op,...trW(TR_HBSYM[nm])],[op,...trW(old)],nm);
  }
  const ms=m.mysize[0], mv=m.mysize[1];               // MYSIZE 자리는 그대로 두고 확인만
  if(!trSame(banks[0].subarray(ms-0x4000,ms-0x4000+3),[0x21,...trW(mv)])) throw new Error(t("mysize"));
  for(const bk of [0,1,2]) put(bk,0x7FDE,[0xCD,...trW(0x78B7)],[0xCD,...trW(m.handler)],'trampoline CALL');

  const b3=hb.slice();                                // bank 3 = HB-F1XD 커널 + 뱅크 전환 스텁
  for(let i=0x3FC0;i<b3.length;i++) if(b3[i]!==0) throw new Error(t("hbTail"));
  b3.set(TR_STUB,0x3FD0);
  banks[3]=b3;

  const out=new Uint8Array(TR_LEN);
  banks.forEach((b,i)=>out.set(b,i*0x4000));
  return out;
}

/* ---------- 상태 ---------- */
const store=new Map();            // sha1 -> File
const cache=new Map();            // sha1 -> Uint8Array (빌드 중 재사용)
let filesRead=0, onlyReady=false, query="";
const opened=new Set();           // 펼쳐 둔 기종
let focusHash=null;               // 짚어 둔 ROM 해시

//  이 팩이 쓰는 ROM 전부.  같은 파일을 여러 슬롯이 쓰면 한 줄로 묶고 자리만 모읍니다.
function romNeeds(m){
  const out=[], seen=new Map();
  const add=(o,where,opt)=>{
    const hs=hashesOf(o); if(!hs.length) return;
    const key=hs[0];
    const e=seen.get(key);
    if(e){ if(!e.where.includes(where)) e.where.push(where); if(!opt) e.opt=false; return; }
    const n={h:key, hs, f:o.f||key, where:[where], opt:!!opt};
    seen.set(key,n); out.push(n);
  };
  if(m.kind==="fw") for(const f of m.fw) add(f, f.name, false);
  else{
    for(const sl of m.slots) for(const b of sl.b) add(b, `${sl.ps}-${sl.ss} ${b.t||"ROM"}`, false);
    for(const d of (m.devices||[])) add(d, d.typ||t("device"), true);
  }
  return out;
}

//  보관소에 있는 첫 번째 해시.  강제 지정한 자리도 여기에 걸립니다.
const pickHash=o=>hashesOf(o).find(h=>store.has(h))||null;

/*  강제 지정: 해시가 맞지 않는 파일이라도 특정 자리에 밀어 넣습니다.  구할 수 없는
    덤프를 다른 판본으로 때워 보려는 경우를 위한 것이고, 검증을 건너뛰므로 그렇게 만든
    팩은 동작을 보장하지 않습니다.  UI 와 로그에 계속 표시하고, 나중에 진짜 파일이
    들어오면 조용히 그걸로 바뀝니다.                                              */
const forced=new Set();
let forceTarget=null;
function unforce(key){ store.delete(key); forced.delete(key); cache.delete(key);
  log(t("unforced",key.slice(0,8))); render(); }
const $=id=>document.getElementById(id);
const allNeeded=(()=>{const mm=new Map();      // 대표 해시 -> 그 자리(그룹)
  for(const m of DATA.machines) for(const g of romNeeds(m)) if(!g.opt && !mm.has(g.h)) mm.set(g.h,g);
  return mm;})();
//  아카이브를 풀 때 쓸모없는 파일을 메모리에 붙들지 않기 위한 집합 (필수 + 선택).
const allWanted=(()=>{const s=new Set();       // 허용되는 모든 해시의 합집합
  for(const m of DATA.machines) for(const g of romNeeds(m)) for(const h of g.hs) s.add(h);
  return s;})();
for(const h of [TR_HB, ...Object.values(TR_MODELS).flatMap(m=>[m.fw,m.disk])]) allWanted.add(h);
const synthed=new Map();          // outSha -> {label, name, bytes}

//  재료가 모이면 turbo R 디스크 ROM 을 만들어 보관소에 넣습니다.  그래야 DOS2 팩이
//  "빌드 가능" 으로 바뀝니다.  합성물은 사용자의 덤프에서만 나옵니다.
async function synthTurboR(){
  const hb=await getRom(TR_HB);
  if(!hb) return;
  for(const key of Object.keys(TR_MODELS)){
    const m=TR_MODELS[key];
    if(store.has(m.outSha)) continue;
    let disk=await getRom(m.disk);
    if(!disk){
      const fw=await getRom(m.fw);
      if(!fw) continue;
      if(fw.length<TR_OFF+TR_LEN) continue;
      disk=fw.subarray(TR_OFF,TR_OFF+TR_LEN);
    }
    try{
      const out=trSynth(disk,hb,m);
      const h=await sha1(out);
      if(h!==m.outSha){ log(t("synthBad",m.label,h.slice(0,8)),true); continue; }
      store.set(m.outSha,new File([out],m.out));
      synthed.set(m.outSha,{label:m.label,name:m.out,bytes:out});
      log(t("synthOk",m.label,m.out));
    }catch(e){ log(t("synthFail",m.label,e.message),true); }
  }
}

async function getRom(h){
  h=h.toLowerCase();
  if(cache.has(h)) return cache.get(h);
  const f=store.get(h); if(!f) return null;
  const u=new Uint8Array(await f.arrayBuffer()); cache.set(h,u); return u;
}
const state=m=>{
  const groups=romNeeds(m);
  const req=groups.filter(g=>!g.opt), need=req.map(g=>g.h);
  const missing=req.filter(g=>!pickHash(g)).map(g=>g.h);
  if(missing.length) return {k:"blocked",need,missing};
  const optMissing=groups.filter(g=>g.opt&&!pickHash(g)).map(g=>g.h);
  const usesForced=groups.some(g=>{const h=pickHash(g); return h&&forced.has(h);});
  return {k:optMissing.length?"partial":"ready",need,missing:[],optMissing,usesForced};
};
function log(msg,err){const d=document.createElement("div");if(err)d.className="err";d.textContent=msg;
  $("log").prepend(d); while($("log").children.length>40)$("log").lastChild.remove();}

/* ---------- 파일 수집 ---------- */
async function addFiles(list){
  let added=0, seen=0, ignored=0, skipped=0;
  const notes=[];
  const onSkip=(n,why)=>{ skipped++; if(notes.length<4) notes.push(`${n.split("/").pop()} — ${why}`); };
  //  해시가 어느 팩에도 쓰이지 않으면 버립니다.  700개짜리 콜렉션을 통째로 들고 있지 않기 위해서입니다.
  const keep=async(bytes,mkFile)=>{
    seen++;
    if(seen%64===0){ $("mFiles").textContent=filesRead+seen; await new Promise(r=>setTimeout(r,0)); }
    const h=await sha1(bytes);
    if(!allWanted.has(h)){ ignored++; return; }
    if(store.has(h)){
      if(forced.has(h)){ store.set(h,mkFile()); forced.delete(h); cache.delete(h); added++;
        log(t("realFile",h.slice(0,8))); }
      return;
    }
    store.set(h,mkFile()); added++;
  };
  for(const f of list){
    try{
      const head=new Uint8Array(await f.slice(0,4).arrayBuffer());
      if(looksZip(head)||looksGz(head)){
        log(t("opening",f.name));
        const bytes=new Uint8Array(await f.arrayBuffer());
        await expandArchive(f.name, bytes, 0,
          (n,b)=>keep(b,()=>new File([b], n.split("/").pop())), onSkip);
      }else{
        await keep(new Uint8Array(await f.arrayBuffer()), ()=>f);
      }
    }catch(e){ log(t("readFail",f.name),true); }
  }
  filesRead+=seen;
  if(added) await synthTurboR();
  if(added||ignored) log(t("added",added,store.size,ignored));
  else if(seen) log(t("noUsable",seen),true);
  if(skipped) log(t("skipped",skipped,notes.join(", "),skipped>notes.length),true);
  render();
}
async function entriesFrom(dt){
  const out=[], walk=async (entry,path)=>{
    if(entry.isFile) await new Promise(r=>entry.file(f=>{out.push(f);r();},r));
    else if(entry.isDirectory){
      const rd=entry.createReader();
      for(;;){ const batch=await new Promise(r=>rd.readEntries(r,()=>r([])));
        if(!batch.length) break;
        for(const e of batch) await walk(e,path+"/"+e.name); }
    }
  };
  const items=[...dt.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(items.length){ for(const e of items) await walk(e,""); return out; }
  return [...dt.files];
}

/* ---------- 내려주기 ----------
   아티팩트 안(window.claude 가 있는 경우)에서는 페이지가 스스로 시작한 다운로드가
   샌드박스에서 막히므로 downloads 기능을 반드시 거쳐야 합니다. 그 기능은 로드 직후가
   아니라 나중에 해석되므로, null 을 캐시하지 않고 매번 다시 시도합니다.            */
let dl=null;
const inArtifact=()=>typeof window.claude==="object"&&window.claude!==null;
async function downloader(){
  if(dl) return dl;
  try{ dl=(await window.claude?.use?.("downloads"))||null; }catch(e){ dl=null; }
  return dl;
}
function toast(msg,bad){
  const t=$("toast"); t.textContent=msg; t.className="toast"+(bad?" bad":" ok"); t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true;},5000);
}
async function offer(filename,bytes){
  const d=await downloader();
  if(d){
    try{ await d.save({filename,data:new Blob([bytes])}); log(t("saved",filename)); toast(t("savedToast",filename)); }
    catch(e){
      const c=e&&e.code;
      if(c==="declined") { log(t("cancelLog")); toast(t("cancelToast")); }
      else if(c==="rejected_extension"){ log(t("extLog",filename),true); toast(t("extToast"),1); }
      else { log(t("saveFail",c||e),true); toast(t("saveFail",c||e),1); }
    }
    return;
  }
  if(inArtifact()){
    // 기능이 아직/끝내 해석되지 않음. 여기서 <a download> 로 내려가면 조용히 실패합니다.
    log(t("noSaveLog"),true);
    toast(t("noSaveToast"),1);
    return;
  }
  const a=document.createElement("a"), url=URL.createObjectURL(new Blob([bytes]));
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  log(t("saved",filename)); toast(t("dlToast",filename));
}
const packOf=m=>m.kind==="fw"?buildFW(m,getRom):buildMSX(m,getRom);

async function buildOne(m){
  try{
    const fk=romNeeds(m).filter(n=>{const h=pickHash(n); return h&&forced.has(h);});
    if(fk.length) log(t("forcedIn",m.name,fk.length),true);
    const bytes=await packOf(m);
    const d=await downloader();
    // 아티팩트 뷰어는 .MSX 확장자를 받지 않으므로 zip으로 감쌉니다.
    if(d) await offer(m.name.replace(/[^\w .-]/g,"_")+".zip", zip([{name:m.name+".MSX",data:bytes}]));
    else  await offer(m.name+".MSX", bytes);
  }catch(e){ log(`${m.name}: ${e.message}`,true); }
}
/* SRAM 파일(FM-PAC·GM2·Halnote·Panasonic SRAM·RTC 설정, docs/sram_images.md).
   코어가 OSD "SRAM(PAC/Turbo-R/...)"(SC1)로 붙이고, 펌웨어는 SC 이미지를 만들거나 늘리지 않으므로
   2 MB 그대로 있어야 합니다(64 kB 칸 32개, 6개 사용).  팩 zip에는 일부러 넣지 않습니다: MSX 폴더를 덮어 풀면
   세이브가 든 SRAM.NVR이 빈 파일로 바뀌기 때문입니다.  사용자가 한 번만 직접 복사합니다. */
async function buildSram(){
  const d=await downloader();
  const bytes=new Uint8Array(32*64*1024);
  if(d) await offer("SRAM.NVR.zip", zip([{name:"SRAM.NVR",data:bytes}]));
  else  await offer("SRAM.NVR", bytes);
  log(t("sramLog"), true);
}
let building=false;
async function buildAll(){
  const ready=DATA.machines.filter(m=>state(m).k!=="blocked");
  if(!ready.length) return;
  building=true; $("buildAll").disabled=true; $("buildAll").textContent=t("building");
  const files=[];
  for(const m of ready){
    try{ files.push({name:(m.kind==="fw"?"Extension/":m.vendor+"/")+m.name+".MSX", data:await packOf(m)}); }
    catch(e){ log(`${m.name}: ${e.message}`,true); }
  }
  if(files.length){ await offer(`msx-packs-${files.length}.zip`, zip(files)); log(t("bundled",files.length)); }
  building=false; $("buildAll").disabled=false; $("buildAll").textContent=t("buildAll");
}

/* ---------- 렌더 ---------- */
function slotSummary(m){
  if(m.kind==="fw") return m.fw.map(f=>f.name).join(" · ");
  const bits=[]; let ram=null;
  for(const s of m.slots) for(const b of s.b){
    if(b.t==="RAM MAPPER") ram=(b.n*16>=1024?(b.n*16/1024)+"MB":(b.n*16)+"KB");
    else if(b.t&&!["ROM","NONE","MIRROR","ROM_MIRROR","IO_MIRROR","SLOT A","SLOT B","RAM"].includes(b.t))
      bits.push(`${s.ps}-${s.ss} ${b.t}`);
  }
  return [m.type, ram&&("RAM "+ram), ...bits].filter(Boolean).join(" · ");
}
function render(){
  //  아직 아무것도 읽지 않았으면 첫 실행 화면 (큰 드롭 영역 + 지원 기종 목록).
  document.querySelector(".wrap").classList.toggle("first", filesRead===0 && store.size===0);
  $("supCount").textContent=DATA.machines.length;
  const total=store.size, needed=allNeeded.size;
  const have=[...allNeeded.values()].filter(g=>pickHash(g)).length;
  $("mFiles").textContent=filesRead; $("mHashes").textContent=total;
  $("mNeeded").textContent=`${have} / ${needed}`;
  const ready=DATA.machines.filter(m=>state(m).k!=="blocked").length;
  $("mReady").textContent=`${ready} / ${DATA.machines.length}`;
  $("bar").style.width=(needed?100*have/needed:0)+"%";
  if(!building){ $("buildAll").disabled=!ready; $("buildAll").textContent=t("buildAll"); }

  //  빠진 ROM 을 그걸 기다리는 기종 수와 함께 모읍니다.  많이 막고 있는 것이 위로 옵니다.
  const miss=new Map();
  for(const m of DATA.machines) for(const n of romNeeds(m)){
    if(pickHash(n)) continue;
    let e=miss.get(n.h);
    if(!e){ e={f:n.f, req:0, opt:0}; miss.set(n.h,e); }
    if(n.opt) e.opt++; else e.req++;
  }
  const missSorted=[...miss].sort((a,b)=>b[1].req-a[1].req || b[1].opt-a[1].opt || a[1].f.localeCompare(b[1].f));
  $("synthWrap").hidden=synthed.size===0;
  $("synthList").innerHTML="";
  for(const [h,o] of synthed){
    const li=document.createElement("li"); li.title=h;
    const t=document.createElement("span"); t.textContent=`${o.label} · ${(o.bytes.length>>10)}KB`;
    const b=document.createElement("button");
    b.className="btn btn-ghost btn-sm"; b.textContent=t("getRom");
    b.addEventListener("click",()=>offer(o.name,o.bytes));
    li.append(t,b); $("synthList").appendChild(li);
  }
  $("missingWrap").hidden=miss.size===0;
  $("missCount").textContent=miss.size?`(${miss.size})`:"";
  $("missingList").innerHTML="";
  for(const [h,e] of missSorted.slice(0,80)){
    const li=document.createElement("li");
    li.dataset.h=h; li.title=h;
    if(focusHash===h) li.classList.add("hit");
    const n=document.createElement("span"); n.className="n"; n.textContent=e.f;
    const c=document.createElement("span"); c.className="c";
    c.textContent=(e.req?t("missReq",e.req):"") + (e.opt?(e.req?" + ":"")+t("missOpt",e.opt):"");
    li.append(n,c);
    li.addEventListener("click",()=>{ focusHash = focusHash===h ? null : h; render(); scrollToRow(); });
    $("missingList").appendChild(li);
  }

  renderList();
}

//  펼친 행에 붙는 판.  이 팩이 쓰는 ROM 을 하나씩, 있는지 없는지와 함께 보여줍니다.
function detail(m,needs){
  const d=document.createElement("div"); d.className="det";
  let noReq=0, noOpt=0;
  let nForced=0;
  for(const n of needs){
    const hit=pickHash(n), have=!!hit, isF=have&&forced.has(hit);
    if(!have) (n.opt?noOpt++:noReq++);
    if(isF) nForced++;
    const r=document.createElement("div");
    r.className="r"+(have?(isF?" forced":""):(n.opt?" optno":" no"))+(focusHash===n.h?" hit":"");
    const dot=document.createElement("i"); dot.className="dot";
    const f=document.createElement("span"); f.className="f";
    f.textContent=n.f;
    const w=document.createElement("em"); w.className="where";
    w.textContent=" · "+n.where.join(", ")+(n.opt?" · "+t("optional"):"")+(isF?" · "+t("forcedTag"):"");
    f.appendChild(w);
    if(n.hs.length>1){ const a=document.createElement("em"); a.className="alt";
      a.textContent=" · "+t("hashes",n.hs.length); f.appendChild(a); }
    const sha=document.createElement("span"); sha.className="sha";
    sha.textContent=(hit||n.h).slice(0,8);
    const pin=document.createElement("button"); pin.className="pin";
    pin.textContent=isF?t("unpin"):t("pin");
    pin.hidden=have&&!isF;
    pin.title=isF?t("unpinTitle"):t("pinTitle");
    pin.addEventListener("click",e=>{ e.stopPropagation();
      if(isF) unforce(n.h); else { forceTarget=n.h; forceInput.click(); } });
    r.append(dot,f,sha,pin); r.title=n.hs.join("\n");
    if(!have) r.addEventListener("click",e=>{
      e.stopPropagation();
      focusHash = focusHash===n.h ? null : n.h;
      render(); scrollToMissing();
    });
    d.appendChild(r);
  }
  const tip=document.createElement("div"); tip.className="tip";
  tip.textContent = noReq ? t("tipBlocked",noReq) : (noOpt ? t("tipOpt",noOpt) : t("tipAll"));
  if(nForced) tip.textContent += t("tipForced",nForced);
  d.appendChild(tip);
  return d;
}
const scrollToMissing=()=>{ const el=$("missingList").querySelector("li.hit"); if(el) el.scrollIntoView({block:"nearest"}); };
const scrollToRow=()=>{ const el=$("list").querySelector(".row.hit"); if(el) el.scrollIntoView({block:"nearest",behavior:"smooth"}); };

function renderList(){
  const byVendor=new Map();
  for(const m of DATA.machines){
    const st=state(m);
    if(onlyReady&&st.k==="blocked") continue;
    if(query&&!m.name.toLowerCase().includes(query)) continue;
    if(!byVendor.has(m.vendor)) byVendor.set(m.vendor,[]);
    byVendor.get(m.vendor).push([m,st]);
  }
  const host=$("list"); host.innerHTML="";
  if(!byVendor.size){ host.innerHTML='<div class="panel"><div class="empty"></div></div>'; host.querySelector(".empty").textContent=t("noMatch"); return; }
  for(const [vendor,items] of [...byVendor].sort((a,b)=>a[0].localeCompare(b[0]))){
    const sec=document.createElement("section"); sec.className="vendor";
    const h3=document.createElement("h3"); h3.textContent=vendor;
    const cnt=document.createElement("span"); cnt.textContent=t("vendorCnt",items.length); h3.appendChild(cnt);
    sec.appendChild(h3);
    const rows=document.createElement("div"); rows.className="rows";
    for(const [m,st] of items){
      const row=document.createElement("div"); row.className="row "+st.k;
      const nm=document.createElement("div"); nm.className="nm";
      const b=document.createElement("b"); b.textContent=m.name;
      const small=document.createElement("small"); small.textContent=slotSummary(m);
      nm.append(b,small);
      const pill=document.createElement("span");
      if(st.k==="ready"){ pill.className=st.usesForced?"pill warn":"pill ok";
        pill.textContent=st.usesForced?t("readyForced"):t("ready"); }
      else if(st.k==="partial"){ pill.className="pill warn"; pill.textContent=t("partial",st.optMissing.length); }
      else { pill.className="pill bad"; pill.textContent=t("blocked",st.missing.length); }
      const btn=document.createElement("button");
      btn.className="btn btn-primary btn-sm"; btn.textContent=t("get"); btn.disabled=st.k==="blocked";
      btn.addEventListener("click",e=>{ e.stopPropagation(); buildOne(m); });
      row.append(nm,pill,btn);
      const needs=romNeeds(m);
      if(focusHash && needs.some(n=>n.h===focusHash && !pickHash(n))) row.classList.add("hit");
      row.addEventListener("click",e=>{
        if(e.target.closest("button")) return;
        if(opened.has(m.name)) opened.delete(m.name); else opened.add(m.name);
        render();
      });
      if(opened.has(m.name)) row.appendChild(detail(m,needs));
      rows.appendChild(row);
    }
    sec.appendChild(rows); host.appendChild(sec);
  }
}

const fileInput=document.createElement("input"); fileInput.type="file"; fileInput.multiple=true;
fileInput.className="hidden-input"; document.body.appendChild(fileInput);

forceInput.className="hidden-input"; document.body.appendChild(forceInput);

$("pickDir").addEventListener("click",()=>dirInput.click());
for(const drop of [$("drop"),$("hero")]){
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
  drop.addEventListener("drop",async e=>{ e.preventDefault(); log(t("reading")); addFiles(await entriesFrom(e.dataTransfer)); });
}
$("heroFiles").addEventListener("click",()=>fileInput.click());
$("heroDir").addEventListener("click",()=>dirInput.click());
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>e.preventDefault());
$("q").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); render(); });
$("fAll").addEventListener("click",()=>{onlyReady=false;$("fAll").setAttribute("aria-pressed","true");
  $("fReady").setAttribute("aria-pressed","false");render();});
$("fReady").addEventListener("click",()=>{onlyReady=true;$("fReady").setAttribute("aria-pressed","true");
  $("fAll").setAttribute("aria-pressed","false");render();});
$("buildAll").addEventListener("click",buildAll);
$("buildSram").addEventListener("click",buildSram);
$("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
});
for(const b of document.querySelectorAll("#lang button")) b.addEventListener("click",()=>{ lang=LANGS.includes(b.dataset.lang)?b.dataset.lang:"en";
  try{ localStorage.setItem("msxPackForge.lang",lang); }catch(err){}
  applyLang(); render(); showSave(); });
applyLang();
render();

/* 저장 경로를 미리 해석해 둡니다: 아티팩트의 downloads 기능은 늦게 붙으므로
   첫 클릭이 그것을 기다리지 않도록 미리 깨워 두고, 어느 경로인지 표시합니다. */
let saveKey="savePrep";
const saveInfo=document.createElement("span"); saveInfo.className="saveinfo";
document.querySelector(".toolbar").appendChild(saveInfo);
const showSave=(k)=>{ if(k) saveKey=k; saveInfo.textContent=t(saveKey); };
(async()=>{
  if(!inArtifact()){ showSave("saveBrowser"); return; }
  showSave("savePrep");
  for(let i=0;i<12;i++){
    if(await downloader()){ showSave("saveArtifact"); return; }
    await new Promise(r=>setTimeout(r,1000));
  }
  showSave("saveNone");
})();
</script>
</html>
